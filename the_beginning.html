<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Story — Light of My Life</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --night:        #0a0712;
      --deep-purple:  #1a0d2e;
      --purple:       #2d1654;
      --mid-purple:   #4a2080;
      --forest:       #1a3320;
      --green:        #2d5a3d;
      --sage:         #4a7c5f;
      --gold:         #f0c040;
      --gold-bright:  #ffd700;
      --gold-glow:    #ffed80;
      --amber:        #e8940a;
      --brown:        #5c3a1e;
      --warm-brown:   #8b5a2b;
      --cream:        #fdf6e3;
      --white:        #fffef8;
      --lantern-core: #fff4a0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--night);
      color: var(--cream);
      font-family: 'Crimson Pro', serif;
      overflow-x: hidden;
      cursor: default;
    }

    /* ═══════════════════════════════════════════════════════
       CANVAS LANTERN BACKGROUND
    ══════════════════════════════════════════════════════════ */
    #lantern-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════
       STAR FIELD
    ══════════════════════════════════════════════════════════ */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%,100% { opacity: var(--min-op); transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.4); }
    }

    /* ═══════════════════════════════════════════════════════
       PAGE WRAPPER
    ══════════════════════════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════════════════
       HERO
    ══════════════════════════════════════════════════════════ */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 120px;
      position: relative;
    }

    /* Glowing entry overlay */
    .glow-burst {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,215,0,0.35) 0%, rgba(255,165,0,0.15) 30%, transparent 70%);
      pointer-events: none;
      z-index: 10;
      animation: burstFade 3.5s ease-out forwards;
    }
    @keyframes burstFade {
      0%   { opacity: 1; transform: scale(0.6); }
      40%  { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.4); }
    }

    /* Sundrop flower SVG glow */
    .sundrop-wrap {
      position: relative;
      width: 160px; height: 160px;
      margin: 0 auto 32px;
      opacity: 0;
      animation: fadeUp 1.2s 0.8s ease forwards;
    }
    .sundrop-glow {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.5) 0%, rgba(255,165,0,0.2) 40%, transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%,100% { transform: scale(1);   opacity: 0.8; }
      50%      { transform: scale(1.2); opacity: 1;   }
    }

    .sundrop-svg {
      width: 160px; height: 160px;
      filter: drop-shadow(0 0 18px rgba(255,215,0,0.9)) drop-shadow(0 0 40px rgba(255,165,0,0.6));
      animation: spinSlow 20s linear infinite;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .hero-eyebrow {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 1s 1.4s forwards;
    }

    .hero-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.2rem, 6vw, 5.5rem);
      font-weight: 700;
      line-height: 1.15;
      background: linear-gradient(135deg, var(--gold-glow) 0%, var(--gold) 40%, var(--amber) 70%, var(--gold-glow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
      opacity: 0;
      animation: fadeUp 1.2s 1.6s forwards;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      font-weight: 400;
      color: var(--sage);
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeUp 1s 2s forwards;
      margin-bottom: 36px;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 1s 2.3s forwards;
    }
    .hero-divider span {
      display: block;
      width: 80px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .hero-divider span:last-child {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .hero-divider em { color: var(--gold); font-size: 1.2rem; }

    .hero-tagline {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1.25rem;
      color: rgba(253,246,227,0.7);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 1s 2.6s forwards;
    }

    .scroll-cue {
      position: absolute;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      opacity: 0;
      animation: fadeUp 1s 3.2s forwards;
      color: rgba(240,192,64,0.5);
      font-family: 'Raleway', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .scroll-cue::after {
      content: '';
      display: block;
      width: 1px; height: 44px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: drip 2s ease-in-out infinite;
    }
    @keyframes drip {
      0%,100% { opacity: 1; transform: scaleY(1); }
      50%      { opacity: 0.3; transform: scaleY(0.5) translateY(8px); }
    }

    /* ═══════════════════════════════════════════════════════
       SECTION SHARED
    ══════════════════════════════════════════════════════════ */
    .section-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 32px;
    }

    .section-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.6rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .section-label::after {
      content: '';
      flex: 1; height: 1px;
      background: linear-gradient(to right, rgba(240,192,64,0.5), transparent);
    }

    /* ═══════════════════════════════════════════════════════
       LETTER SECTION
    ══════════════════════════════════════════════════════════ */
    .letter-section {
      position: relative;
    }
    .letter-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(26,13,46,0.7) 15%,
        rgba(26,13,46,0.85) 50%,
        rgba(26,13,46,0.7) 85%,
        transparent 100%
      );
      pointer-events: none;
    }

    .letter-card {
      position: relative;
      border: 1px solid rgba(240,192,64,0.25);
      border-radius: 4px;
      padding: 64px 72px;
      background: rgba(10,7,18,0.7);
      backdrop-filter: blur(8px);
      box-shadow:
        0 0 0 1px rgba(240,192,64,0.08),
        0 0 60px rgba(240,192,64,0.06),
        inset 0 0 80px rgba(26,13,46,0.5);
    }

    /* corner ornaments */
    .letter-card::before, .letter-card::after {
      font-size: 1.4rem;
      color: var(--gold);
      opacity: 0.4;
      position: absolute;
    }
    .letter-card::before { content: '✦'; top: 18px; left: 24px; }
    .letter-card::after  { content: '✦'; bottom: 18px; right: 24px; }

    .letter-flower {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.7));
    }

    .letter-salutation {
      font-family: 'Crimson Pro', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--gold);
      margin-bottom: 28px;
    }

    .letter-body {
      font-family: 'Crimson Pro', serif;
      font-size: 1.2rem;
      line-height: 2;
      color: rgba(253,246,227,0.88);
    }
    .letter-body p + p { margin-top: 20px; }

    .letter-closing {
      margin-top: 44px;
      text-align: right;
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--gold);
    }

    /* ═══════════════════════════════════════════════════════
       VINE DIVIDER
    ══════════════════════════════════════════════════════════ */
    .vine-divider {
      text-align: center;
      padding: 20px 0;
      font-size: 1.5rem;
      color: var(--sage);
      opacity: 0.6;
      letter-spacing: 0.5rem;
    }

    /* ═══════════════════════════════════════════════════════
       VIDEO & MEDIA
    ══════════════════════════════════════════════════════════ */
    .media-section {
      position: relative;
    }

    .media-glow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(74,32,128,0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .video-main-wrap {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(240,192,64,0.2);
      box-shadow:
        0 0 40px rgba(240,192,64,0.12),
        0 0 100px rgba(74,32,128,0.3),
        0 24px 64px rgba(0,0,0,0.6);
    }

    .video-main-wrap video,
    .placeholder-h {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      object-fit: cover;
    }

    .placeholder-h {
      background: linear-gradient(135deg, var(--deep-purple) 0%, var(--night) 50%, var(--forest) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
    }

    .play-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(240,192,64,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: var(--gold);
      box-shadow: 0 0 30px rgba(240,192,64,0.3);
      transition: all 0.3s;
    }
    .play-btn:hover {
      box-shadow: 0 0 60px rgba(240,192,64,0.6);
      transform: scale(1.08);
    }

    .placeholder-h p, .placeholder-v p {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      color: rgba(240,192,64,0.6);
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .media-caption {
      text-align: center;
      margin-top: 20px;
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(240,192,64,0.65);
      letter-spacing: 0.06em;
    }

    /* ═══════════════════════════════════════════════════════
       2x2 GRIDS
    ══════════════════════════════════════════════════════════ */
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid-item video,
    .placeholder-v,
    .grid-item img {
      width: 100%;
      display: block;
      border-radius: 5px;
      border: 1px solid rgba(240,192,64,0.15);
      box-shadow:
        0 0 24px rgba(240,192,64,0.08),
        0 16px 48px rgba(0,0,0,0.5);
      object-fit: cover;
    }

    .grid-item video,
    .placeholder-v {
      aspect-ratio: 9/16;
    }

    .grid-item img {
      aspect-ratio: 3/4;
    }

    .placeholder-v {
      background: linear-gradient(160deg, var(--deep-purple) 0%, var(--forest) 60%, var(--night) 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
    }

    .play-btn-sm {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1.5px solid rgba(240,192,64,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--gold);
      box-shadow: 0 0 20px rgba(240,192,64,0.2);
    }

    .item-caption {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 0.95rem;
      text-align: center;
      color: rgba(240,192,64,0.6);
      letter-spacing: 0.04em;
    }

    /* hover glow on media items */
    .grid-item:hover video,
    .grid-item:hover img,
    .grid-item:hover .placeholder-v {
      border-color: rgba(240,192,64,0.4);
      box-shadow:
        0 0 40px rgba(240,192,64,0.18),
        0 20px 60px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }

    /* ═══════════════════════════════════════════════════════
       DEEP SECTION BGs
    ══════════════════════════════════════════════════════════ */
    .bg-purple-wash {
      background: linear-gradient(180deg, transparent, rgba(26,13,46,0.6) 20%, rgba(26,13,46,0.6) 80%, transparent);
    }
    .bg-green-wash {
      background: linear-gradient(180deg, transparent, rgba(26,51,32,0.5) 20%, rgba(26,51,32,0.5) 80%, transparent);
    }

    /* ═══════════════════════════════════════════════════════
       FLOATING PARTICLES (golden dust)
    ══════════════════════════════════════════════════════════ */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-bright), var(--amber));
      pointer-events: none;
      z-index: 2;
      animation: floatUp var(--fdur) ease-in var(--fdelay) infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { opacity: 0;   transform: translateY(0)     scale(1);   }
      15%  { opacity: 0.9; }
      80%  { opacity: 0.4; }
      100% { opacity: 0;   transform: translateY(-100vh) scale(0.3); }
    }

    /* ═══════════════════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════════════════════ */
    .footer {
      text-align: center;
      padding: 60px 24px 80px;
      position: relative;
    }
    .footer::before {
      content: '';
      display: block;
      width: 200px; height: 1px;
      margin: 0 auto 40px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .footer-flower {
      font-size: 2rem;
      display: block;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 12px rgba(255,215,0,0.8));
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .footer-text {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: rgba(240,192,64,0.6);
      letter-spacing: 0.08em;
    }

    /* ═══════════════════════════════════════════════════════
       REVEAL ANIMATIONS
    ══════════════════════════════════════════════════════════ */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-d1 { transition-delay: 0.15s; }
    .reveal-d2 { transition-delay: 0.3s;  }
    .reveal-d3 { transition-delay: 0.45s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════════════════════ */
    @media (max-width: 620px) {
      .letter-card { padding: 36px 24px; }
      .grid-2x2    { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Glow burst on load -->
  <div class="glow-burst"></div>

  <!-- Star field -->
  <div class="stars" id="stars"></div>

  <!-- Lantern canvas -->
  <canvas id="lantern-canvas"></canvas>

  <!-- Golden dust particles -->
  <div id="particles"></div>

  <div class="page">

    <!-- ═══ HERO ══════════════════════════════════════════ -->
    <section class="hero">

      <!-- Sundrop flower -->
      <div class="sundrop-wrap">
        <div class="sundrop-glow"></div>
        <svg class="sundrop-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#fff9c4"/>
              <stop offset="50%"  stop-color="#ffd700"/>
              <stop offset="100%" stop-color="#e8940a"/>
            </radialGradient>
            <radialGradient id="petalGrad" cx="50%" cy="0%" r="100%" gradientUnits="objectBoundingBox">
              <stop offset="0%"   stop-color="#ffe066"/>
              <stop offset="60%"  stop-color="#f0c040"/>
              <stop offset="100%" stop-color="#c87a00"/>
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- 8 outer petals -->
          <g filter="url(#glow)">
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(45 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(90 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(135 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(180 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(225 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(270 80 80)"/>
            <ellipse cx="80" cy="30" rx="10" ry="28" fill="url(#petalGrad)" opacity="0.95" transform="rotate(315 80 80)"/>
          </g>
          <!-- inner petals -->
          <g filter="url(#glow)">
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(45 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(90 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(135 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(180 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(225 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(270 80 80)"/>
            <ellipse cx="80" cy="46" rx="7" ry="18" fill="#fff4a0" opacity="0.85" transform="rotate(315 80 80)"/>
          </g>
          <!-- centre -->
          <circle cx="80" cy="80" r="22" fill="url(#coreGrad)" filter="url(#glow)"/>
          <circle cx="80" cy="80" r="14" fill="#fff9c4" opacity="0.9"/>
          <circle cx="80" cy="80" r="7"  fill="white"   opacity="0.8"/>
        </svg>
      </div>

      <p class="hero-eyebrow">a love story written in light</p>
      <h1 class="hero-title">Our Beginning</h1>
      <h2 class="hero-subtitle">You Are My Sundrop</h2>

      <div class="hero-divider">
        <span></span>
        <em>✦</em>
        <span></span>
      </div>


      <div class="scroll-cue">scroll</div>
    </section>


    <div class="vine-divider reveal">🌿 &nbsp; ✦ &nbsp; 🌿</div>
    <!-- ═══ MAIN VIDEO ════════════════════════════════════ -->
    <section class="media-section">
      <div class="media-glow-bg"></div>
      <div class="section-wrap">
        <p class="section-label reveal">✦ &nbsp; Our story</p>
        <div class="video-main-wrap reveal reveal-d1">
          
            <video controls poster="thumbnail.jpg">
              <source src="apr_2026/pics/vids/VID_20250430_101827_896.mp4" type="video/mp4"/>
            </video>
          
          
        </div>
      </div>
    </section>
 
    <div class="vine-divider reveal">🌿 &nbsp; ✦ &nbsp; 🌿</div>
 

    <!-- ═══ 2×2 VIDEOS ════════════════════════════════════ -->
    <section class="media-section bg-green-wash">
      <div class="section-wrap">
        <p class="section-label reveal">✦ &nbsp; Little moments</p>
        <div class="grid-2x2">

  <script>
    /* ── STAR FIELD ─────────────────────────────────────── */
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const s = document.createElement('div');
      const size = Math.random() * 2.5 + 0.5;
      s.className = 'star';
      s.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        width:${size}px; height:${size}px;
        --dur:${2 + Math.random()*4}s;
        --delay:${Math.random()*6}s;
        --min-op:${0.1 + Math.random()*0.4};
      `;
      starsEl.appendChild(s);
    }

    /* ── FLOATING DUST PARTICLES ────────────────────────── */
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      const size = Math.random() * 4 + 1;
      p.className = 'particle';
      p.style.cssText = `
        left:${Math.random()*100}%;
        bottom:${Math.random()*20}%;
        width:${size}px; height:${size}px;
        --fdur:${6 + Math.random()*10}s;
        --fdelay:${Math.random()*12}s;
      `;
      particlesEl.appendChild(p);
    }

    /* ── LANTERN CANVAS ─────────────────────────────────── */
    const canvas = document.getElementById('lantern-canvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Each lantern object
    class Lantern {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x    = Math.random() * canvas.width;
        this.y    = init ? Math.random() * canvas.height : canvas.height + 60;
        this.size = 14 + Math.random() * 22;
        this.speed= 0.3 + Math.random() * 0.5;
        this.drift= (Math.random() - 0.5) * 0.4;
        this.glow = 0.4 + Math.random() * 0.6;
        this.hue  = 38 + Math.random() * 20; // golden range
        this.phase= Math.random() * Math.PI * 2;
        this.flickerSpeed = 0.02 + Math.random() * 0.03;
      }
      update() {
        this.y    -= this.speed;
        this.x    += this.drift;
        this.phase+= this.flickerSpeed;
        if (this.y < -80) this.reset();
      }
      draw() {
        const flicker = 0.8 + Math.sin(this.phase) * 0.2;
        const alpha   = this.glow * flicker;
        const s       = this.size;

        ctx.save();
        ctx.translate(this.x, this.y);

        // outer glow
        const grd = ctx.createRadialGradient(0, 0, s * 0.1, 0, 0, s * 2.2);
        grd.addColorStop(0,   `hsla(${this.hue},100%,75%,${alpha * 0.5})`);
        grd.addColorStop(0.4, `hsla(${this.hue},90%,55%,${alpha * 0.2})`);
        grd.addColorStop(1,   `hsla(${this.hue},80%,40%,0)`);
        ctx.beginPath();
        ctx.arc(0, 0, s * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();

        // lantern body
        ctx.beginPath();
        ctx.roundRect(-s*0.45, -s*0.6, s*0.9, s*1.1, s*0.15);
        const bodyGrd = ctx.createLinearGradient(-s*0.45, -s*0.6, s*0.45, s*0.5);
        bodyGrd.addColorStop(0,   `hsla(${this.hue},100%,80%,${alpha})`);
        bodyGrd.addColorStop(0.5, `hsla(${this.hue},95%,60%,${alpha})`);
        bodyGrd.addColorStop(1,   `hsla(${this.hue-10},85%,40%,${alpha})`);
        ctx.fillStyle = bodyGrd;
        ctx.fill();

        // top cap
        ctx.beginPath();
        ctx.roundRect(-s*0.3, -s*0.72, s*0.6, s*0.18, s*0.06);
        ctx.fillStyle = `hsla(${this.hue},80%,40%,${alpha})`;
        ctx.fill();

        // bottom tassel
        ctx.beginPath();
        ctx.moveTo(-s*0.08, s*0.5);
        ctx.lineTo( s*0.08, s*0.5);
        ctx.lineTo( s*0.04, s*0.85);
        ctx.lineTo(-s*0.04, s*0.85);
        ctx.fillStyle = `hsla(${this.hue-10},70%,35%,${alpha * 0.8})`;
        ctx.fill();

        // inner glow
        const innerGrd = ctx.createRadialGradient(0, -s*0.1, 0, 0, -s*0.1, s*0.5);
        innerGrd.addColorStop(0,   `hsla(${this.hue+20},100%,95%,${alpha * 0.9 * flicker})`);
        innerGrd.addColorStop(0.6, `hsla(${this.hue},100%,70%,${alpha * 0.4})`);
        innerGrd.addColorStop(1,   `hsla(${this.hue},90%,50%,0)`);
        ctx.beginPath();
        ctx.roundRect(-s*0.4, -s*0.55, s*0.8, s*0.95, s*0.12);
        ctx.fillStyle = innerGrd;
        ctx.fill();

        ctx.restore();
      }
    }

    // Create ~55 lanterns
    const lanterns = Array.from({ length: 55 }, () => new Lantern());

    function animateLanterns() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lanterns.forEach(l => { l.update(); l.draw(); });
      requestAnimationFrame(animateLanterns);
    }
    animateLanterns();

    /* ── SCROLL REVEAL ──────────────────────────────────── */
    const revealEls = document.querySelectorAll('.reveal');
    const observer  = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      }),
      { threshold: 0.1 }
    );
    revealEls.forEach(el => observer.observe(el));
  </script>
